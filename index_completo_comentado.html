<!-- Define que o documento usa HTML5. -->
<!DOCTYPE html>

      /* Define como largura e altura calculam bordas e preenchimentos. */
      box-sizing: border-box;
      /* Define a margem externa do elemento. */
      margin: 0;
      /* Define o espaçamento interno do elemento. */
      padding: 0;
    /* Finaliza esse bloco de estilização. */
    }

    /* Inicia a estilização do seletor :root. */

      /* Define a propriedade CSS --azul-medio. */

      /* Define a propriedade CSS --vermelho. */

      /* Define a propriedade CSS --texto. */
      --texto: #f8fafc;
      /* Define a propriedade CSS --texto-suave. */

    /* Finaliza esse bloco de estilização. */
    }

    /* Inicia a estilização do seletor body. */
    body {
      /* Define a família de fonte usada no texto. */
      font-family: Arial, Helvetica, sans-serif;
      /* Define a altura mínima do elemento. */
      min-height: 100vh;
      /* Define a cor do texto. */
      color: var(--texto);
      /* Define o fundo do elemento. */
      background:
        /* Linha de estilo CSS. */
        radial-gradient(circle at top left, rgba(29, 78, 216, 0.35), transparent 36%),
        /* Linha de estilo CSS. */
        radial-gradient(circle at top right, rgba(239, 68, 68, 0.22), transparent 32%),
        /* Linha de estilo CSS. */
        linear-gradient(135deg, #020617, #0f172a 55%, #111827);
    /* Finaliza esse bloco de estilização. */
    }

    /* Inicia a estilização do seletor header. */
    header {
      /* Define o tipo de posicionamento do elemento. */
      position: sticky;
      /* Define a distância em relação ao topo. */
      top: 0;
      /* Define a ordem de sobreposição na tela. */

      align-items: center;

      gap: 18px;
      /* Permite que os itens quebrem linha. */

    }

      // Verifica uma condição antes de executar o código.

    // Cria uma função usada pelo site.
    function exibirLista(lista, grade, filtro) {
      // Insere conteúdo HTML dentro do elemento.
      grade.innerHTML = "";
      // Cria uma variável/constante usada nesta parte do código.
      const filtradas = aplicarFiltro(lista, filtro);
      // Cria uma variável/constante usada nesta parte do código.
      const obras = limitarLista(ordenarPorNota(filtradas), 16);

      // Verifica uma condição antes de executar o código.
      if (obras.length === 0) {
        // Cria uma variável/constante usada nesta parte do código.
        const aviso = document.createElement("p");
        // Define a classe CSS do elemento criado.
        aviso.className = "aviso";
        // Define o texto visível do elemento.
        aviso.textContent = "Nenhum resultado encontrado para esse filtro.";
        // Adiciona um elemento dentro de outro na página.
        grade.appendChild(aviso);
        // Linha de lógica JavaScript do projeto.
        return;
      // Organiza ou fecha um bloco de dados/código.
      }

      // Percorre todos os itens de uma lista.
      obras.forEach((obra) => {
        // Adiciona um elemento dentro de outro na página.
        grade.appendChild(criarCard(obra));
      // Linha de lógica JavaScript do projeto.
      });
    // Organiza ou fecha um bloco de dados/código.
    }

    // Cria uma função usada pelo site.
    function adicionarFavorito(obra) {
      // Verifica uma condição antes de executar o código.

        alert("Essa obra já está nos favoritos.");
        // Linha de lógica JavaScript do projeto.
        return;
      // Organiza ou fecha um bloco de dados/código.

      // Cria uma variável/constante usada nesta parte do código.
      const favoritos = buscarFavoritos();
      // Linha de lógica JavaScript do projeto.
      favoritos.push(obra);
      // Linha de lógica JavaScript do projeto.
      salvarFavoritos(favoritos);
      // Mostra uma mensagem de alerta para o usuário.
      alert("Adicionado aos favoritos!");

    // Cria uma função usada pelo site.
    function removerFavorito(id) {
      // Cria uma variável/constante usada nesta parte do código.
      const favoritosAtualizados = buscarFavoritos().filter((obra) => Number(obra.id) !== Number(id));
      // Linha de lógica JavaScript do projeto.
      salvarFavoritos(favoritosAtualizados);
      // Linha de lógica JavaScript do projeto.
      renderizarFavoritos();
    // Organiza ou fecha um bloco de dados/código.
